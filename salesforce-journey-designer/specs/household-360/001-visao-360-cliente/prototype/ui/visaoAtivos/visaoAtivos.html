<template>
    <!-- P4 — abas por família (LBC lightning-tabset, 1º na hierarquia) + cartões
         de produto no padrão do console (Cenários 6 e 7).
         Emite `selecionar` { id } — nunca busca detalhe nem abre aba paralela. -->
    <lightning-card title="Produtos" icon-name="utility:card_details">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <lightning-tabset active-tab-value={abaAtiva}>
                <template for:each={abas} for:item="aba">
                    <lightning-tab key={aba.valor} label={aba.rotulo} value={aba.valor} onactive={aoAtivarAba}>
                        <template lwc:if={aba.temItens}>
                            <template for:each={aba.itens} for:item="ativo">
                                <button
                                    key={ativo.id}
                                    type="button"
                                    class={ativo.classeCartao}
                                    data-id={ativo.id}
                                    aria-pressed={ativo.selecionado}
                                    onclick={aoSelecionar}>
                                    <span class="c-prod_topo">
                                        <lightning-icon icon-name={ativo.icone} size="small" alternative-text={ativo.rotulo}></lightning-icon>
                                        <span class="c-prod_titulos">
                                            <span class="c-prod_nome">{ativo.rotulo}</span>
                                            <span class="c-prod_numero">{ativo.identificador}</span>
                                        </span>
                                        <lightning-badge label={ativo.situacao}></lightning-badge>
                                        <span class="c-prod_relatorio">Ver relatório</span>
                                    </span>
                                    <dl class="c-prod_grade">
                                        <dt class="slds-text-title">Número</dt>
                                        <dd class="slds-text-body_regular slds-truncate">{ativo.numero}</dd>
                                        <dt class="slds-text-title">Valor</dt>
                                        <dd class="slds-text-body_regular slds-truncate">{ativo.valor}</dd>
                                        <dt class="slds-text-title">Encerramento</dt>
                                        <dd class="slds-text-body_regular slds-truncate">{ativo.encerramento}</dd>
                                        <dt class="slds-text-title">Última movimentação</dt>
                                        <dd class="slds-text-body_regular slds-truncate">{ativo.ultimaMov}</dd>
                                    </dl>
                                </button>
                            </template>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-body_small">Nenhum vínculo nesta família — demais abas inalteradas (EL-01).</p>
                        </template>
                    </lightning-tab>
                </template>
            </lightning-tabset>
        </div>
    </lightning-card>
</template>

<template>
    <!-- Eventos da vida — timeline no padrão do console (tile azul + glifo
         branco em SVG próprio + check sobre a linha). Controles: ordem,
         filtro de ano e novo evento (futuro). Entrada: @api eventos
         [{id, titulo, data, glifo}]. Sem eventos. -->
    <lightning-card title="Eventos da vida" icon-name="standard:event">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template lwc:if={temEventos}>
                <div class="c-eventos-barra slds-m-bottom_small">
                    <span class="c-eventos-ordem">
                        <span>Recentes primeiro</span>
                        <lightning-input
                            type="toggle"
                            label="Recentes primeiro"
                            variant="label-hidden"
                            checked={recentesPrimeiro}
                            message-toggle-active=""
                            message-toggle-inactive=""
                            onchange={aoAlternarOrdem}>
                        </lightning-input>
                    </span>
                    <lightning-button-menu
                        label={rotuloAno}
                        variant="border"
                        onselect={aoTrocarAno}>
                        <template for:each={opcoesAno} for:item="opcao">
                            <lightning-menu-item key={opcao.value} label={opcao.label} value={opcao.value}></lightning-menu-item>
                        </template>
                    </lightning-button-menu>
                    <lightning-button
                        label="Novo evento"
                        variant="neutral"
                        disabled
                        title="Criação de evento é capacidade futura (fora do MVP)">
                    </lightning-button>
                </div>
                <template lwc:if={temVisiveis}>
                    <div class="c-eventos-trilha">
                        <template for:each={eventosVisiveis} for:item="evento">
                            <div key={evento.id} class="c-eventos_no">
                                <div class="c-eventos_no-tile">
                                    <template lwc:if={evento.ehPessoa}>
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="#fff"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6v1H4v-1z" fill="#fff"/></svg>
                                    </template>
                                    <template lwc:if={evento.ehAlianca}>
                                        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>
                                    </template>
                                    <template lwc:if={evento.ehCasa}>
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3l9-8z" fill="#fff"/></svg>
                                    </template>
                                    <template lwc:if={evento.ehBebe}>
                                        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M8.5 14.5q3.5 3 7 0"/></svg>
                                    </template>
                                    <template lwc:if={evento.ehTrofeu}>
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5" fill="#fff"/><path d="M10 14l-2.5 7L12 19l4.5 2L14 14z" fill="#fff"/></svg>
                                    </template>
                                    <template lwc:if={evento.ehLocal}>
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a6 6 0 016 6c0 4.5-6 12-6 12S6 12.5 6 8a6 6 0 016-6z" fill="#fff"/><circle cx="12" cy="8" r="2.5" fill="#066afe"/></svg>
                                    </template>
                                    <span class="c-eventos_no-check" aria-hidden="true">
                                        <lightning-icon icon-name="utility:success" size="xx-small" variant="inverse" alternative-text=""></lightning-icon>
                                    </span>
                                </div>
                                <div class="c-eventos_no-titulo">{evento.titulo}</div>
                                <div class="c-eventos_no-data">{evento.data}</div>
                            </div>
                        </template>
                    </div>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small">Sem eventos neste ano.</p>
                </template>
            </template>
            <template lwc:else>
                <p class="slds-text-body_small">Sem eventos da vida para esta raiz.</p>
            </template>
        </div>
    </lightning-card>
</template>

<template>
    <lightning-modal-header label="Selecionar cota de consórcio"></lightning-modal-header>
    <lightning-modal-body>
        <p class="slds-m-bottom_small slds-text-body_small" style="color:#5c5c5c">Cliente possui múltiplas cotas — Imóvel, Veículo e Rural (com mais de uma cota no mesmo grupo Rural). Escolha a cota que motivou o contato.</p>
        <div class="slds-grid slds-wrap slds-gutters">
            <template for:each={cotas} for:item="cota">
                <div key={cota.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                    <button type="button" class="c-consorcio-card" style={cota.estiloCartao} data-id={cota.id} onclick={aoEscolherCota} aria-label={cota.ariaLabel}>
                        <div class="c-consorcio-card_top">
                            <span class="c-consorcio-card_tipo" style={cota.estiloTexto}>
                                <lightning-icon icon-name={cota.icone} size="x-small" alternative-text={cota.tipo}></lightning-icon>
                                {cota.tipo} • Grupo {cota.grupo} / Cota {cota.cota}
                            </span>
                            <lightning-badge label={cota.badge}></lightning-badge>
                        </div>
                        <div class="c-consorcio-card_valor" style={cota.estiloTexto}>{cota.valor}</div>
                        <div class="c-consorcio-card_detalhe" style={cota.estiloTexto}>{cota.contemplada} • {cota.parcela}</div>
                        <div class="c-consorcio-card_status" style={cota.estiloTexto}>Status: {cota.status}</div>
                    </button>
                </div>
            </template>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Cancelar" variant="neutral" onclick={aoCancelar}></lightning-button>
    </lightning-modal-footer>
</template>

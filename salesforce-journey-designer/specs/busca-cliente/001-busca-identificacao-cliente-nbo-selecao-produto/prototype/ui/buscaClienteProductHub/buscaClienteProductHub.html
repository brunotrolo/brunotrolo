<template>
    <!-- P4/P7 — hub de produtos. Emite `productselect` { tipo }. -->
    <lightning-card title="Produtos Porto Bank" icon-name="standard:account" class="slds-m-top_small">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template lwc:if={temProdutos}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <template for:each={produtos} for:item="produto">
                        <div key={produto.tipo} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_small">
                            <button
                                type="button"
                                class={produto.classeCartao}
                                data-tipo={produto.tipo}
                                aria-pressed={produto.selecionado}
                                onclick={aoSelecionar}>
                                <lightning-icon icon-name={produto.icone} size="medium" alternative-text={produto.nome}></lightning-icon>
                                <span class="c-product-card_nome">{produto.nome}</span>
                                <span class="slds-text-body_small">{produto.resumo}</span>
                                <lightning-badge label={produto.selo}></lightning-badge>
                            </button>
                        </div>
                    </template>
                </div>
            </template>
            <template lwc:else>
                <p>Este cliente não possui vínculos ativos no Porto Bank.</p>
            </template>
        </div>
    </lightning-card>
</template>
